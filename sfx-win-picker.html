<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>胜利音效试听 · 母女救援</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif;color:#2b2540;background:#ECE8F4}
  header{padding:18px 24px 6px;max-width:920px}
  h1{margin:0;font-size:20px}
  header p{margin:4px 0 0;color:#6a6385}
  main{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;padding:16px 24px 40px;max-width:1040px}
  .card{background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 2px 8px #2b25401f;outline:4px solid transparent;outline-offset:2px;display:flex;flex-direction:column;gap:8px}
  .card.picked{outline-color:#7B5CF0}
  .card.old{background:#F6F3EC}
  .card b{font-size:16px}
  .card small{color:#6a6385}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  button{font:700 13px system-ui,"Microsoft YaHei";border:0;border-radius:10px;padding:8px 14px;cursor:pointer}
  .play{background:#FFE9B8;color:#5A3108}
  .full{background:#E4EEFF;color:#2E3A5C}
  .pick{background:#EEE8FF;color:#5b3fd0}
  .card.picked .pick{background:#7B5CF0;color:#fff}
  .len{display:inline-block;padding:1px 8px;border-radius:8px;background:#F0EDF8;color:#4a4266;font-size:12px;font-weight:700}
  .bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:6px 24px;color:#4a4266}
  .stop{background:#F3E1E1;color:#7a2a2a}
</style>
</head>
<body>
<header>
  <h1>胜利音效试听</h1>
  <p>“播放”只听这个音效；“按游戏里的顺序听”会接着放妈妈说的那句话，跟过关时的完整效果一样。选好后点“选这版”，告诉我编号就行。</p>
</header>
<div class="bar">
  <label>试听音量 <input id="vol" type="range" min="0.2" max="1" step="0.05" value="0.7"></label>
  <button class="stop" id="stop">■ 全部停止</button>
</div>
<main id="list"></main>
<script>
const V=[
  {id:'0',file:'assets/fanfare.ogg',vol:.72,len:'1.0 秒',name:'现在用的（过关）',desc:'现在每关过关时放的号角声，做对比用',old:true},
  {id:'0b',file:'assets/chapter-done.ogg',vol:.7,len:'2.0 秒',name:'现在用的（修好一间小屋）',desc:'修好整间小屋时放的，做对比用',old:true},
  {id:'1',file:'assets/sfx-preview/win-1.ogg',vol:.6,len:'1.8 秒',name:'1 · 音乐盒',desc:'音乐盒加钢片琴往上走四个音，带一点雪橇铃，温柔安静'},
  {id:'2',file:'assets/sfx-preview/win-2.ogg',vol:.55,len:'1.7 秒',name:'2 · 温暖管弦',desc:'弦乐和圆号慢慢涨起来，加竖琴，最有“团聚”的感觉'},
  {id:'3',file:'assets/sfx-preview/win-3.ogg',vol:.6,len:'1.4 秒',name:'3 · 木琴欢快',desc:'木琴和钟琴快速往上，再一个亮晶晶的和弦，轻快俏皮'},
  {id:'4',file:'assets/sfx-preview/win-4.ogg',vol:.55,len:'2.5 秒',name:'4 · 圣诞铃铛',desc:'雪橇铃和手铃，节日气氛最浓，和雪景最搭'},
  {id:'5',file:'assets/sfx-preview/win-5.ogg',vol:.6,len:'1.7 秒',name:'5 · 钢琴魔法',desc:'钢琴和弦加闪光和风铃，像炉火被点亮，最柔和'},
  {id:'6',file:'assets/sfx-preview/win-6.ogg',vol:.5,len:'2.5 秒',name:'6 · 嗒哒庆祝',desc:'铜管加拨弦的“嗒哒”加镲声，最热闹，像消消乐过关'},
];
const list=document.getElementById('list'),vol=document.getElementById('vol');
const live=new Set(),timers=new Set();
function sound(file,v,delay=0){const id=setTimeout(()=>{timers.delete(id);const a=new Audio(file);a.volume=Math.min(1,v*vol.value/0.7);live.add(a);a.onended=()=>live.delete(a);a.play();},delay);timers.add(id);}
function stopAll(){for(const id of timers)clearTimeout(id);timers.clear();for(const a of live){a.pause();}live.clear();}
document.getElementById('stop').onclick=stopAll;
for(const v of V){
  const c=document.createElement('div');c.className='card'+(v.old?' old':'');
  c.innerHTML=`<b>${v.name}</b><span><span class="len">${v.len}</span></span><small>${v.desc}</small><div class="row"><button class="play">▶ 播放</button><button class="full">按游戏里的顺序听</button>${v.old?'':'<button class="pick">选这版</button>'}</div>`;
  c.querySelector('.play').onclick=()=>{stopAll();sound(v.file,v.vol);};
  // Same timing as a win in the game (confetti hiss removed): jingle, then mom's line 1.2s after it.
  c.querySelector('.full').onclick=()=>{stopAll();sound(v.file,v.vol);sound('assets/voice-warm.ogg',.8,1200);};
  const p=c.querySelector('.pick');
  if(p)p.onclick=()=>{document.querySelectorAll('.card').forEach(x=>{x.classList.remove('picked');const b=x.querySelector('.pick');if(b)b.textContent='选这版';});c.classList.add('picked');p.textContent='已选 '+v.id;};
  list.appendChild(c);
}
</script>
</body>
</html>
