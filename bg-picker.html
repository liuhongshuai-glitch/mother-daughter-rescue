<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>背景图候选 · 母女救援</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif;color:#2b2540;background:#ECE8F4}
  header{padding:18px 24px 6px}
  h1{margin:0;font-size:20px}
  header p{margin:4px 0 0;color:#6a6385}
  main{display:grid;grid-template-columns:auto 1fr;gap:24px;padding:16px 24px 32px;align-items:start}
  .phone{position:sticky;top:16px;width:390px;height:780px;border-radius:36px;padding:12px;background:#1d1a26;box-shadow:0 18px 40px #2b254055}
  .phone iframe{width:100%;height:100%;border:0;border-radius:26px;background:#22344F;display:block}
  .now{margin-top:10px;text-align:center;font-weight:700;color:#4a4266}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
  .opt{all:unset;cursor:pointer;display:flex;flex-direction:column;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 2px 8px #2b25401f;transition:transform .15s,box-shadow .15s;outline:3px solid transparent}
  .opt:hover{transform:translateY(-3px);box-shadow:0 8px 18px #2b254033}
  .opt[aria-pressed=true]{outline-color:#7B5CF0}
  .opt img{width:100%;aspect-ratio:9/16;object-fit:cover;display:block}
  .opt b{padding:8px 10px 0;font-size:15px}
  .opt span{padding:0 10px 10px;color:#6a6385;font-size:12.5px}
  .opt .tag{display:inline-block;margin-left:6px;padding:0 6px;border-radius:6px;background:#EEE8FF;color:#7B5CF0;font-size:11px;font-weight:700;vertical-align:2px}
  @media (max-width:820px){main{grid-template-columns:1fr}.phone{position:static;margin:auto;width:min(390px,100%);height:720px}}
</style>
</head>
<body>
<header>
  <h1>背景图候选</h1>
  <p>点右侧缩略图，左边手机里的真实游戏会立刻换上对应背景（只是预览，不会改动游戏文件）。</p>
</header>
<main>
  <div>
    <div class="phone"><iframe id="game" src="/index.html?autostart=1" title="游戏预览"></iframe></div>
    <div class="now" id="now">当前：现用版</div>
  </div>
  <div class="grid" id="grid"></div>
</main>
<script>
const OPTIONS=[
  {src:'assets/ui-bg-ice.webp',name:'现用版',desc:'紫蓝星空 + 粉色地平线',tag:'现用'},
  {src:'assets/bg-options/1-aurora.webp',name:'① 极光雪夜',desc:'深蓝星空，青紫极光，松林雪丘'},
  {src:'assets/bg-options/2-dusk-cabin.webp',name:'② 暮色小屋',desc:'粉橙晚霞，远处亮灯的小木屋，最暖'},
  {src:'assets/bg-options/3-moon-forest.webp',name:'③ 月下雪林',desc:'大满月，两侧雪松夹景，银蓝安静'},
  {src:'assets/bg-options/4-frost-window.webp',name:'④ 霜花窗景',desc:'屋内看窗外，霜花边框 + 暖黄小镇灯'},
  {src:'assets/bg-options/5-pastel-morning.webp',name:'⑤ 晴雪清晨',desc:'浅蓝薄荷粉彩，阳光冰晶，最明亮'},
  {src:'assets/bg-options/6-lantern-night.webp',name:'⑥ 灯笼雪夜',desc:'紫夜星河，雪坡上一串暖灯笼'},
];
const grid=document.getElementById('grid'),game=document.getElementById('game'),now=document.getElementById('now');
let current=0;
function apply(){
  const doc=game.contentDocument;if(!doc)return;
  doc.documentElement.style.setProperty('--ui-ice',`url("${new URL(OPTIONS[current].src,location.href).href}")`);
}
function pick(i){
  current=i;apply();
  now.textContent='当前：'+OPTIONS[i].name;
  grid.querySelectorAll('.opt').forEach((b,j)=>b.setAttribute('aria-pressed',j===i));
}
OPTIONS.forEach((o,i)=>{
  const b=document.createElement('button');b.className='opt';b.setAttribute('aria-pressed',i===0);
  b.innerHTML=`<img src="${o.src}" alt="${o.name}" loading="lazy"><b>${o.name}${o.tag?`<i class="tag">${o.tag}</i>`:''}</b><span>${o.desc}</span>`;
  b.onclick=()=>pick(i);grid.append(b);
});
// The game sets --ui-ice on load; re-apply the chosen option whenever the iframe (re)loads.
game.addEventListener('load',()=>setTimeout(apply,50));
</script>
</body>
</html>
