<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>无限模式 · 自动生成关卡预览</title>
<style>
  body{margin:0;font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#2C1A0B;color:#FFF1D6}
  header{padding:20px 24px 8px}
  h1{margin:0 0 6px;font-size:22px}
  p{margin:4px 0;color:#E9D7B8;font-size:14px;line-height:1.6}
  .bar{display:flex;flex-wrap:wrap;gap:10px;padding:10px 24px}
  button{border:0;border-radius:999px;padding:10px 18px;font-size:15px;cursor:pointer;background:#F3E3C2;color:#4A2E14;font-weight:700}
  button.go{background:#7DB65A;color:#fff}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;padding:12px 24px 40px}
  .card{background:#F7ECD6;border-radius:14px;padding:12px;color:#4A2E14}
  .card h3{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between}
  .card h3 small{font-weight:400;color:#8A6A48}
  .board{display:grid;aspect-ratio:1;border:3px solid #6B4423;border-radius:6px;overflow:hidden}
  .cell{position:relative;border:1px solid #0000001a;display:grid;place-items:center;font-size:14px}
  .cell.ans::after{content:"";width:46%;height:46%;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #4A2E14}
  .cell.given::after{background:#F2C14E}
  .meta{margin-top:6px;font-size:12px;color:#8A6A48}
  .ok{color:#3E7D27;font-weight:700}.bad{color:#B3261E;font-weight:700}
</style>
</head>
<body>
<header>
  <h1>无限模式 · 自动生成关卡预览</h1>
  <p>下面每张棋盘都是浏览器当场随机生成的，规则和正式关卡一样：每行、每列、每个色区各放一个，物资之间不能相邻（斜角也不行）。白点是唯一答案。</p>
  <p>每一张都会再交给游戏自己的求解器检查一次，「唯一解 ✓」表示只有这一种放法。棋盘尺寸按盘数递增：第 1–2 盘 6×6，之后 6/7 交替，再往后是 7/8。</p>
</header>
<div class="bar">
  <button id="again">重新生成</button>
  <button id="ending" class="go">进入游戏终章（解锁 20 关，试玩无限模式）</button>
</div>
<p style="padding:0 24px">⚠ 「进入游戏终章」会把本机的存档改成“20 关全部通关”，停在第 20 关的胜利卡上，点「查看所有小屋」就能看到终章卡和「开启无限模式」按钮。</p>
<div class="grid" id="grid"></div>
<script type="module">
import { LEVELS, solve } from './engine.js';
import { generateEndless, endlessSize } from './endless.js';
const COLORS=['#F4B6C2','#8FCBC9','#E8968A','#9DB4E8','#F2CF7E','#C3A6DB','#B98E6E','#A9C79A'];
const ROUNDS=[1,2,3,4,6,8,10,13];
function render(){
  const grid=document.getElementById('grid');grid.innerHTML='';
  for(const round of ROUNDS){
    const t0=performance.now(),b=generateEndless(round),ms=Math.round(performance.now()-t0);
    const answers=solve({n:b.n,regions:b.regions,givens:b.givens},[],2).length;
    const card=document.createElement('div');card.className='card';
    card.innerHTML=`<h3>无限 · 第 ${round} 盘<small>${b.n}×${b.n} · 修复 ${(round-1)%5+1}/5</small></h3>`;
    const board=document.createElement('div');board.className='board';board.style.gridTemplateColumns=`repeat(${b.n},1fr)`;
    const sol=new Set(b.solution),giv=new Set(b.givens);
    b.regions.forEach((r,i)=>{const c=document.createElement('div');c.className='cell'+(sol.has(i)?' ans':'')+(giv.has(i)?' given':'');c.style.background=COLORS[r];board.appendChild(c);});
    card.appendChild(board);
    const meta=document.createElement('div');meta.className='meta';
    meta.innerHTML=`${answers===1?'<span class="ok">唯一解 ✓</span>':'<span class="bad">多解 ✗</span>'} · 生成耗时 ${ms} ms${b.givens.length?` · 预置 ${b.givens.length} 个`:''}`;
    card.appendChild(meta);grid.appendChild(card);
  }
}
document.getElementById('again').onclick=render;
document.getElementById('ending').onclick=()=>{
  const KEY='mother-daughter-rescue-v1',last=LEVELS.length-1,lv=LEVELS[last];
  let s={};try{s=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch{}
  const placements=lv.solution.filter(i=>!lv.givens.includes(i));
  Object.assign(s,{version:1,index:last,completed:[...Array(LEVELS.length).keys()],tutorialSeen:true,tutorialVersion:5,endless:null,
    current:{placements,marks:[],credits:placements,phase:'won',remainingMs:3600000,elapsedMs:60000,hintsUsed:0,deadEnd:false,savedAt:Date.now()}});
  localStorage.setItem(KEY,JSON.stringify(s));location.href='./index.html';
};
render();
</script>
</body>
</html>
