  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4a2e17">
  <title>暖一点 · 母女救援</title>
  <link rel="preload" href="./assets/fonts/chill.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="game">
    <header class="topbar">
      <span id="levelLabel"></span>
      <a class="brand" href="#" aria-label="暖一点"><span id="brand">暖一点<small>A LITTLE WARMER</small></span></a>
      <nav>
        <button id="quickLanguage" class="round-button" aria-label="Switch to English">EN</button>
        <button id="mapButton" class="round-button" aria-label="小屋地图"><img class="ui-icon" data-ui="icon-map" alt=""><span class="sr-only">小屋地图</span></button>
        <button id="settingsButton" class="round-button" aria-label="设置"><img class="ui-icon" data-ui="icon-settings" alt=""></button>
      </nav>
    </header>
    <section class="story">
      <div class="chapter-line"><span id="chapterLabel"></span></div>
      <div class="scene-wrap"><canvas id="scene" width="1050" height="720" aria-label="母亲和女儿等待修复的小屋"></canvas><div id="sceneCaption" class="scene-caption"></div></div>
      <div class="task-heading">
        <div class="task-banner"><p id="eyebrow" class="eyebrow sr-only"></p><h1 id="taskTitle"></h1><div id="taskSteps" class="task-steps"></div></div>
        <div class="clock" id="clock" role="timer" aria-label="剩余时间"><img class="ui-icon" data-ui="icon-clock" alt=""><b id="time">3:00</b></div>
        <div class="repair-line"><div id="repairTrack" class="repair-track"><span id="repairFill"></span></div><span id="repairText"></span><img id="repairIcon" alt=""></div>
      </div>
    </section>
    <section class="puzzle-panel" aria-label="逻辑棋盘">
      <div class="board-heading"><h2 id="boardTitle"></h2><span id="placedCount"></span></div>
      <p id="rules" class="rules"></p>
      <div id="boardCoach" class="board-coach" hidden>
        <p id="coachText" role="status" aria-live="polite" aria-atomic="true"></p>
<div class="coach-actions"><button id="coachSkip" type="button"></button></div>
      </div>
      <div class="board-wrap">
        <div id="board" class="board" role="grid" aria-label="救援数独棋盘"></div>
        <svg id="conflictLinks" class="conflict-links" aria-hidden="true"></svg>
        <div id="levelIntro" class="level-intro"><div id="levelStart" class="level-start-card" role="status" aria-live="polite"></div></div>
        <div id="resultBanner" class="result-banner" role="status" aria-live="assertive" hidden></div>
      </div>
      <p id="message" class="message" role="status" aria-live="polite"></p>
      <div class="tools">
        <button id="undoButton"><img class="ui-icon" data-ui="icon-undo" alt=""><span data-i18n="undo">撤销</span></button>
        <button id="hintButton"><img class="ui-icon" data-ui="icon-hint" alt=""><span data-i18n="hint">提示</span></button>
        <button id="resetButton"><img class="ui-icon" data-ui="icon-restart" alt=""><span data-i18n="reset">重来</span></button>
        <button id="playButton" type="button">开始修复</button>
      </div>
      <p id="gestureHelp" class="gesture-help"></p>
    </section>
    <footer id="footer"></footer>
  </main>
  <dialog id="modal"><div id="modalContent"></div></dialog>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="./app.js"></script>
